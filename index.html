<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Clock Wallpaper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://umairjailani.github.io/Digital-Clock/" />
    <meta property="og:title"       content="Digital Clock Wallpaper" />
    <meta property="og:description" content="Animated wallpaper clock with 5 peaceful scenes — Beach, Forest, Night Sky, Aurora, Snow. Toggle date/time units, 12h/24h. Wallpaper Engine compatible." />
    <meta property="og:image"       content="https://umairjailani.github.io/Digital-Clock/preview.png" />
    <meta name="twitter:card"       content="summary_large_image" />
    <meta name="twitter:image"      content="https://umairjailani.github.io/Digital-Clock/preview.png" />
  </head>
  <body>

    <canvas id="bg"></canvas>

    <div class="clock-wrap">
      <div class="clock-display" id="clockDisplay"></div>
    </div>

    <div class="ui-overlay" id="uiOverlay">
      <div class="toggle-row" id="toggleRow">
        <button class="tog active" data-unit="year">Year</button>
        <button class="tog active" data-unit="month">Month</button>
        <button class="tog active" data-unit="day">Day</button>
        <button class="tog active" data-unit="hours">Hours</button>
        <button class="tog active" data-unit="minutes">Min</button>
        <button class="tog active" data-unit="seconds">Sec</button>
        <button class="tog fmt-divider" id="fmtBtn">24H</button>
      </div>
      <div class="scene-row">
        <button class="scene-btn active" data-scene="beach">🏖 Beach</button>
        <button class="scene-btn" data-scene="forest">🌿 Forest</button>
        <button class="scene-btn" data-scene="night">🌙 Night Sky</button>
        <button class="scene-btn" data-scene="aurora">🌌 Aurora</button>
        <button class="scene-btn" data-scene="snow">❄️ Snow</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
